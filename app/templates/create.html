{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h2>NEW PROJECT</h2>
        <div class="divider"></div>
    </div>

    <div class="control-panel">
        
        <div class="input-group full-width">
            <label>1. VISUAL PROMPT (SCENE)</label>
            <input type="text" id="promptInput" placeholder="A cyberpunk detective standing in neon rain...">
        </div>

        <div class="input-group full-width">
            <label>2. BACKGROUND MONOLOGUE (SCRIPT)</label>
            <textarea id="monologueInput" rows="3" placeholder="The rain never stops in this city..."></textarea>
        </div>

        <div class="settings-grid">
            <div class="input-group">
                <label>STYLE</label>
                <select id="styleInput">
                    <option value="cinematic">Cinematic</option>
                    <option value="anime">Anime</option>
                    <option value="photorealistic">Photorealistic</option>
                    <option value="noir">Film Noir</option>
                    <option value="cyberpunk">Cyberpunk</option>
                </select>
            </div>
            <div class="input-group">
                <label>AUDIO ENGINE</label>
                <select id="voiceInput">
                    <option value="false">EdgeTTS</option>
                </select>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

        <div class="input-group full-width">
            <label style="color: var(--accent);">3. BRAND KIT MANAGER</label>
            <div style="background: #000; padding: 20px; border: 1px dashed #333; border-radius: 4px; margin-top: 10px;">
                
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                    <div>
                        <label style="font-size: 0.8em; color: #888;">WATERMARK (PNG)</label>
                        <input type="file" id="fileWatermark" accept="image/png" style="font-size: 0.8em;">
                    </div>
                    <div>
                        <label style="font-size: 0.8em; color: #888;">INTRO (MP4)</label>
                        <input type="file" id="fileIntro" accept="video/mp4" style="font-size: 0.8em;">
                    </div>
                    <div>
                        <label style="font-size: 0.8em; color: #888;">OUTRO (MP4)</label>
                        <input type="file" id="fileOutro" accept="video/mp4" style="font-size: 0.8em;">
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <button onclick="uploadAssets()" class="btn-secondary" style="padding: 10px 20px; font-size: 0.8em; margin: 0;">
                        💾 UPLOAD ASSETS
                    </button>
                    <span id="upload-status" style="font-family: monospace; font-size: 0.9em;"></span>
                </div>
            </div>

            <div style="margin-top: 15px; display: flex; gap: 20px;">
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                    <input type="checkbox" id="useWatermark" style="width: auto;"> 
                    APPLY WATERMARK
                </label>
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                    <input type="checkbox" id="useIntro" style="width: auto;"> 
                    ADD INTRO
                </label>
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                    <input type="checkbox" id="useOutro" style="width: auto;"> 
                    ADD OUTRO
                </label>
                 <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                    <input type="checkbox" id="useSubtitles" checked style="width: auto;"> 
                    ADD SUBTITLES
                </label>
            </div>
        </div>

        <button onclick="startGeneration()" id="genBtn" class="btn-generate">INITIALIZE GENERATION</button>
    </div>

    <div id="status-monitor" class="status-panel hidden">
        <div class="status-header">SYSTEM LOG</div>
        <div id="status-text" class="status-console">Waiting for input...</div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const API_BASE = "/api/v1";

    // --- ASSET UPLOAD LOGIC ---
    async function uploadAssets() {
        const statusText = document.getElementById("upload-status");
        statusText.innerText = "> UPLOADING...";
        statusText.style.color = "yellow";

        const formData = new FormData();
        const watermark = document.getElementById("fileWatermark").files[0];
        const intro = document.getElementById("fileIntro").files[0];
        const outro = document.getElementById("fileOutro").files[0];

        if (watermark) formData.append("watermark", watermark);
        if (intro) formData.append("intro", intro);
        if (outro) formData.append("outro", outro);

        if ([...formData.entries()].length === 0) {
            statusText.innerText = "> NO FILE SELECTED";
            statusText.style.color = "orange";
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/upload-assets`, {
                method: "POST",
                body: formData
            });
            
            if (res.ok) {
                const data = await res.json();
                statusText.innerText = "> " + data.message.toUpperCase();
                statusText.style.color = "#00f2ff"; // Your accent color
            } else {
                throw new Error("Upload Failed");
            }
        } catch (e) {
            console.error(e);
            statusText.innerText = "> UPLOAD ERROR";
            statusText.style.color = "red";
        }
    }

    // --- GENERATION LOGIC ---
    async function startGeneration() {
        const prompt = document.getElementById('promptInput').value;
        const monologue = document.getElementById('monologueInput').value;
        const style = document.getElementById('styleInput').value;
        const usePaid = document.getElementById('voiceInput').value === "true";
        
        // Grab Toggle Values
        const useWatermark = document.getElementById('useWatermark').checked;
        const useIntro = document.getElementById('useIntro').checked;
        const useOutro = document.getElementById('useOutro').checked;
        const useSubtitles = document.getElementById('useSubtitles').checked;
        
        const btn = document.getElementById('genBtn');
        const monitor = document.getElementById('status-monitor');
        const statusText = document.getElementById('status-text');

        if (!prompt) return alert("Visual Prompt Required");

        // UI Update
        btn.disabled = true;
        btn.innerText = "PROCESSING...";
        monitor.classList.remove('hidden');
        statusText.innerText = "> Uplinking to Server...";

        try {
            const res = await fetch(`${API_BASE}/generate`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    prompt, 
                    monologue, 
                    style, 
                    is_paid_voice: usePaid,
                    use_watermark: useWatermark,
                    use_intro: useIntro,
                    use_outro: useOutro,
                    use_subtitles: useSubtitles
                })
            });
            
            if (!res.ok) throw new Error("API Error");

            const data = await res.json();
            pollStatus(data.task_id);
        } catch (e) {
            console.error(e);
            alert("Connection Failed: " + e.message);
            btn.disabled = false;
            statusText.innerText = "> CONNECTION FAILED";
        }
    }

    async function pollStatus(taskId) {
        const statusText = document.getElementById('status-text');
        const interval = setInterval(async () => {
            try {
                const res = await fetch(`${API_BASE}/tasks/${taskId}`);
                const data = await res.json();
                
                statusText.innerText = `> TASK ${taskId.split('-')[0]}: ${data.status}`;

                if (data.status.includes("COMPLETED")) {
                    clearInterval(interval);
                    statusText.innerText = "> GENERATION COMPLETE. REDIRECTING...";
                    setTimeout(() => window.location.href = "/gallery", 1500);
                } else if (data.status === "FAILED") {
                    clearInterval(interval);
                    statusText.innerText = "> SYSTEM FAILURE: " + (data.error || "Unknown Error");
                    document.getElementById('genBtn').disabled = false;
                }
            } catch (e) {
                console.error("Poll Error", e);
            }
        }, 2000);
    }
</script>
{% endblock %}
