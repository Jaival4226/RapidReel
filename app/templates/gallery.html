{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
        <h2>PROJECT GALLERY</h2>
        <button onclick="loadGallery()" class="db-link" style="font-size: 0.8em; padding: 5px 15px; cursor: pointer;">
            🔄 REFRESH
        </button>
    </div>
    <div class="divider"></div>

    <div id="gallery-grid" class="gallery-grid">
        <div class="loading-spinner">Loading Projects...</div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const API_BASE = "/api/v1";

    async function loadGallery() {
        const grid = document.getElementById('gallery-grid');
        // Don't clear grid immediately to prevent flicker, only clear when data arrives
        
        try {
            const res = await fetch(`${API_BASE}/tasks?limit=50`);
            const tasks = await res.json();

            if (tasks.length === 0) {
                grid.innerHTML = '<div style="color:#666; text-align:center; grid-column:1/-1;">No projects found. Create one!</div>';
                return;
            }

            // Simple HTML build string
            let html = '';

            tasks.forEach(task => {
                // 1. Determine Video Source or Placeholder
                let mediaHtml = '';
                if (task.final_output && task.status === 'COMPLETED') {
                    // Cache-bust to show remix changes instantly
                    const videoUrl = `/videos/${task.id}_final.mp4?t=${new Date().getTime()}`;
                    mediaHtml = `
                        <video controls preload="metadata" poster="/static/placeholder.png">
                            <source src="${videoUrl}" type="video/mp4">
                        </video>`;
                } else if (task.status === 'FAILED') {
                    mediaHtml = `<div class="error-placeholder">❌ FAILED</div>`;
                } else {
                    mediaHtml = `<div class="processing-placeholder">
                        <div class="spinner"></div>
                        <div style="margin-top:10px; font-size:0.8em;">${task.status}</div>
                    </div>`;
                }

                const statusColor = task.status === 'COMPLETED' ? 'var(--accent)' : 
                                    task.status === 'FAILED' ? 'red' : 'orange';

                const editButton = task.status === 'COMPLETED' 
                    ? `<a href="/studio?id=${task.id}" class="db-link" style="font-size: 0.7em; padding: 4px 8px; text-decoration:none;">✏️ EDIT</a>` 
                    : '';

                html += `
                    <div class="card">
                        <div class="card-media">
                            ${mediaHtml}
                        </div>
                        <div class="card-meta">
                            <div class="meta-prompt" title="${task.prompt}">${task.prompt}</div>
                            
                            <div class="meta-details" style="font-size:0.75em; color:#666; margin-top:5px;">
                                <span>${task.style || 'Normal'}</span> • 
                                <span>${task.is_paid_voice ? 'Paid Voice' : 'Free Voice'}</span>
                            </div>

                            <div class="meta-status" style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                                <span style="color: ${statusColor}; font-weight:bold; font-size:0.8em;">
                                    ${task.status}
                                </span>
                                ${editButton}
                            </div>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;

        } catch (e) {
            console.error(e);
            grid.innerHTML = `<div style="color:red;">Error loading gallery: ${e}</div>`;
        }
    }

    // Load once on page load. No SetInterval.
    loadGallery();
</script>

<style>
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
        margin-top: 20px;
    }
    .card {
        background: #0a0a0a;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        transition: transform 0.2s;
    }
    .card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
    }
    .card-media {
        width: 100%;
        aspect-ratio: 16/9;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 1px solid #222;
    }
    .card-media video {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .card-meta {
        padding: 15px;
    }
    .meta-prompt {
        font-size: 0.9em;
        color: #ddd;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .processing-placeholder, .error-placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #555;
    }
    .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid #333;
        border-top: 2px solid var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
{% endblock %}
