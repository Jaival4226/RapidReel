{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 1400px;">
    <div class="page-header">
        <h2>RAPID REEL STUDIO <span style="font-size:0.5em; color:var(--accent);">// REMIX ENGINE</span></h2>
        <div class="divider"></div>
    </div>

    <div class="studio-grid" style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 30px;">
        
        <div class="control-panel">
            <h3 style="color: #888; margin-bottom: 20px;">
                TASK: <span id="taskIdDisplay" class="mono">loading...</span>
            </h3>

            <div class="input-group">
                <label>SCRIPT DOCTOR (Audio)</label>
                <textarea id="monologueInput" rows="6" style="font-size: 0.9em; line-height: 1.4;"></textarea>
            </div>

            <div class="input-group">
                <label style="color: var(--accent);">BRAND ASSETS (Global Library)</label>
                <div style="background: #080808; padding: 15px; border: 1px dashed #333; border-radius: 4px;">
                    <div style="display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 10px;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <label style="font-size:0.7em; color:#666; width: 80px;">WATERMARK</label> 
                            <input type="file" id="fileWatermark" accept="image/png" style="font-size: 0.8em; flex: 1;">
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <label style="font-size:0.7em; color:#666; width: 80px;">INTRO</label> 
                            <input type="file" id="fileIntro" accept="video/mp4" style="font-size: 0.8em; flex: 1;">
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <label style="font-size:0.7em; color:#666; width: 80px;">OUTRO</label> 
                            <input type="file" id="fileOutro" accept="video/mp4" style="font-size: 0.8em; flex: 1;">
                        </div>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <button onclick="uploadAssets()" class="btn-secondary" style="padding: 5px 10px; font-size: 0.7em; margin: 0;">
                            💾 UPLOAD & UPDATE
                        </button>
                        <span id="upload-status" style="font-family: monospace; font-size: 0.7em;"></span>
                    </div>
                </div>
            </div>

            <div class="input-group" style="background: #080808; padding: 15px; border: 1px solid #333; border-radius: 4px;">
                <label style="color: var(--accent); margin-bottom: 10px; display: block;">BRANDING OVERRIDES</label>
                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <label class="checkbox-label">
                        <input type="checkbox" id="useWatermark"> WATERMARK
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="useIntro"> INTRO
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="useOutro"> OUTRO
                    </label>
                     <label class="checkbox-label">
                        <input type="checkbox" id="useSubtitles"> SUBTITLES
                    </label>
                </div>
            </div>

            <div class="input-group">
                <label>VISUAL PROMPT (Changing this regenerates video)</label>
                <input type="text" id="promptInput" style="color: #aaa;">
            </div>

            <button onclick="submitRemix()" id="remixBtn" class="btn-generate" style="background: var(--text-main); color: black;">
                ⚡ APPLY CHANGES & RENDER
            </button>
            <div id="status-text" class="status-console" style="margin-top: 10px;">Ready.</div>
        </div>

        <div class="preview-panel" style="background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <video id="studioPlayer" controls style="width: 100%; max-height: 600px; border: 1px solid #333; box-shadow: 0 0 20px rgba(0,0,0,0.5);"></video>
            
            <div style="margin-top: 15px; width: 100%; display: flex; justify-content: space-between;">
                <a id="downloadLink" href="#" class="db-link" download>DOWNLOAD MP4</a>
                <span class="mono" style="color: #666;">PREVIEW MODE</span>
            </div>
        </div>
    </div>
</div>

<style>
    .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9em; }
    .checkbox-label input { width: auto; margin: 0; }
</style>
{% endblock %}

{% block scripts %}
<script>
    const API_BASE = "/api/v1";
    const urlParams = new URLSearchParams(window.location.search);
    const TASK_ID = urlParams.get('id');
    
    let initialData = {};

    // --- UPLOAD LOGIC (NEW IN STUDIO) ---
    async function uploadAssets() {
        const statusText = document.getElementById("upload-status");
        statusText.innerText = "> UPLOADING...";
        statusText.style.color = "yellow";

        const formData = new FormData();
        const watermark = document.getElementById("fileWatermark").files[0];
        const intro = document.getElementById("fileIntro").files[0];
        const outro = document.getElementById("fileOutro").files[0];

        if (watermark) formData.append("watermark", watermark);
        if (intro) formData.append("intro", intro);
        if (outro) formData.append("outro", outro);

        if ([...formData.entries()].length === 0) {
            statusText.innerText = "> NO FILE SELECTED";
            statusText.style.color = "orange";
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/upload-assets`, {
                method: "POST",
                body: formData
            });
            
            if (res.ok) {
                const data = await res.json();
                statusText.innerText = "> UPDATED";
                statusText.style.color = "#00f2ff"; 
            } else {
                throw new Error("Upload Failed");
            }
        } catch (e) {
            console.error(e);
            statusText.innerText = "> ERROR";
            statusText.style.color = "red";
        }
    }

    // --- TASK LOADING ---
    async function loadTask() {
        if (!TASK_ID) {
            alert("No Task ID provided.");
            window.location.href = "/gallery";
            return;
        }

        document.getElementById('taskIdDisplay').innerText = TASK_ID.split('-')[0];
        document.getElementById('status-text').innerText = "> Loading Assets...";

        try {
            const res = await fetch(`${API_BASE}/tasks/${TASK_ID}`);
            const data = await res.json();
            
            initialData = data; 

            document.getElementById('monologueInput').value = data.monologue || "";
            document.getElementById('promptInput').value = data.prompt || "";
            document.getElementById('useWatermark').checked = data.use_watermark;
            document.getElementById('useIntro').checked = data.use_intro;
            document.getElementById('useOutro').checked = data.use_outro;
            document.getElementById('useSubtitles').checked = data.use_subtitles;

            if (data.final_output) {
                updateVideoPlayer();
            }
            document.getElementById('status-text').innerText = "> Ready to Remix.";

        } catch (e) {
            console.error(e);
            alert("Failed to load task.");
        }
    }

    function updateVideoPlayer() {
        const container = document.querySelector('.preview-panel');
        const oldPlayer = document.getElementById('studioPlayer');
        if (oldPlayer) oldPlayer.remove();

        const newPlayer = document.createElement('video');
        newPlayer.id = 'studioPlayer';
        newPlayer.controls = true;
        newPlayer.style.width = '100%';
        newPlayer.style.maxHeight = '600px';
        newPlayer.style.border = '1px solid #333';
        newPlayer.style.boxShadow = '0 0 20px rgba(0,0,0,0.5)';
        
        const url = `/videos/${TASK_ID}_final.mp4?v=${Math.random()}`;
        newPlayer.src = url;
        
        const controlsDiv = container.querySelector('div[style*="margin-top"]');
        container.insertBefore(newPlayer, controlsDiv);
        
        const link = document.getElementById('downloadLink');
        link.href = url;
    }

    // --- REMIX LOGIC ---
    async function submitRemix() {
        const btn = document.getElementById('remixBtn');
        const status = document.getElementById('status-text');
        
        btn.disabled = true;
        btn.innerText = "REMIXING...";
        status.innerText = "> Calculating differences...";
        status.style.color = "yellow";

        const currentPrompt = document.getElementById('promptInput').value;
        const currentMonologue = document.getElementById('monologueInput').value;
        const currentStyle = initialData.style || "cinematic"; 

        const regenVideo = (currentPrompt.trim() !== initialData.prompt.trim());
        const regenAudio = (currentMonologue.trim() !== initialData.monologue.trim());

        const payload = {
            prompt: currentPrompt,
            monologue: currentMonologue,
            style: currentStyle,
            is_paid_voice: initialData.is_paid_voice,
            
            use_watermark: document.getElementById('useWatermark').checked,
            use_intro: document.getElementById('useIntro').checked,
            use_outro: document.getElementById('useOutro').checked,
            use_subtitles: document.getElementById('useSubtitles').checked,
            
            regenerate_video: regenVideo,
            regenerate_audio: regenAudio
        };

        try {
            const res = await fetch(`${API_BASE}/remix/${TASK_ID}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!res.ok) throw new Error("Remix Failed");
            
            status.innerText = "> Rendering in Background...";
            pollStatus();

        } catch (e) {
            alert(e.message);
            btn.disabled = false;
            btn.innerText = "⚡ APPLY CHANGES & RENDER";
        }
    }

    async function pollStatus() {
        const status = document.getElementById('status-text');
        const interval = setInterval(async () => {
            const res = await fetch(`${API_BASE}/tasks/${TASK_ID}`);
            const data = await res.json();

            status.innerText = `> STATUS: ${data.status}`;

            if (data.status === "COMPLETED") {
                clearInterval(interval);
                status.innerText = "> RENDER COMPLETE.";
                status.style.color = "var(--accent)";
                
                initialData = { ...initialData, ...data };
                initialData.prompt = document.getElementById('promptInput').value;
                initialData.monologue = document.getElementById('monologueInput').value;

                updateVideoPlayer(); 
                
                document.getElementById('remixBtn').disabled = false;
                document.getElementById('remixBtn').innerText = "⚡ APPLY CHANGES & RENDER";
            } else if (data.status === "FAILED") {
                clearInterval(interval);
                status.innerText = "> REMIX FAILED.";
                status.style.color = "red";
                alert("Remix Failed! Check logs.");
                document.getElementById('remixBtn').disabled = false;
            }
        }, 2000);
    }

    loadTask();
</script>
{% endblock %}
